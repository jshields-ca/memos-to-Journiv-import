# Memos hashtag → Journiv mood mapping
#
# This config is tuned for the actual hashtag conventions in this Memos export.
# The mood tags use a "mood-" prefix (e.g. #mood-rad, #mood-good) which maps
# directly to Journiv's default mood names.
#
# Keys: hashtag name WITHOUT the # (lowercase)
# Values: mood name EXACTLY as it appears in Journiv Settings → Moods
#
# If you've customised mood names in Journiv, update the values on the right
# to match what's in your Journiv instance.

mood_map:
  mood-rad: "Rad"
  mood-good: "Good"
  mood-meh: "Meh"
  mood-bad: "Bad"
  mood-awful: "Awful"

# Tags that will be silently dropped — never carried over as Journiv tags.
# "daylio-import" is a provenance marker from the original Daylio migration
# and has no meaning in Journiv.
exclude_tags:
  - daylio-import
  - tldr

# Hashtags that matched a mood entry are stripped from the entry body.
# The mood is recorded on the entry itself, so the tag is redundant in text.
strip_mood_hashtags_from_content: true

# Strip ALL hashtags from entry bodies (including tags that become Journiv tags).
# Journiv shows tags separately from content, so this is a matter of preference.
# Defaults to false — tags remain visible in the entry text.
strip_all_hashtags_from_content: false
