# Memos hashtag → Journiv mood mapping
#
# Keys are hashtag names from Memos (without the # symbol, lowercase).
# Values are mood names exactly as they appear in Journiv Settings → Moods.
#
# How this works:
#   - If a memo has #happy in its content, the Journiv entry gets mood "Great"
#   - If a memo has multiple mapped hashtags, the first one wins
#   - Unmapped hashtags become Journiv tags (not moods)
#   - If a memo has no mapped hashtags, mood is left unset
#
# IMPORTANT: The mood names (values) must exactly match mood names you've
# created in your Journiv instance. Journiv ships with default moods —
# check Settings → Moods in your Journiv UI and update this file to match.
#
# Journiv's default moods are typically: Rad, Good, Meh, Bad, Awful
# Adjust the values below to match your setup.

mood_map:
  # Positive
  happy: "Rad"
  great: "Rad"
  amazing: "Rad"
  excellent: "Rad"
  excited: "Rad"
  fantastic: "Rad"
  joy: "Rad"

  # Good
  good: "Good"
  fine: "Good"
  content: "Good"
  pleased: "Good"
  grateful: "Good"
  thankful: "Good"

  # Neutral
  meh: "Meh"
  okay: "Meh"
  ok: "Meh"
  neutral: "Meh"
  tired: "Meh"
  blah: "Meh"

  # Bad
  bad: "Bad"
  sad: "Bad"
  anxious: "Bad"
  stressed: "Bad"
  worried: "Bad"
  upset: "Bad"
  frustrated: "Bad"
  angry: "Bad"

  # Awful
  awful: "Awful"
  terrible: "Awful"
  depressed: "Awful"
  miserable: "Awful"
  horrible: "Awful"

# When true, hashtags that matched a mood are removed from the entry body.
# The mood is set on the entry, so the hashtag is redundant in the text.
strip_mood_hashtags_from_content: true

# When true, ALL hashtags (including unmapped ones) are stripped from the
# entry body. Unmapped ones still become Journiv tags.
strip_all_hashtags_from_content: false
